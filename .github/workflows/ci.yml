name: Cross-platform tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHON: python

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Update Python packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Linux GUI runtime library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Set up application (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup.sh

      - name: Set up application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup.ps1

      - name: Run checks (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/check.sh
          .venv/bin/wirewrap-labels --help

      - name: Run checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\check.ps1
          .\.venv\Scripts\wirewrap-labels.exe --help
