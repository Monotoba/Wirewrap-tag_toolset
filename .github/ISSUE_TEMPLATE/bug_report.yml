name: Bug report
description: Report a reproducible problem with the designer or generated output.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Wire-Wrap Tag Designer.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Include pin count, pin-row width, sheet stock, and relevant settings.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.8
  - type: textarea
    id: logs
    attributes:
      label: Error output or supporting files
      description: Paste error text or drag in screenshots and non-sensitive generated files.
      render: shell
